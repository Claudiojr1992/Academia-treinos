plugins {
    id 'com.android.application'
}

android {
    namespace 'br.com.treinoemdia'
    compileSdk 34

    defaultConfig {
        applicationId 'br.com.treinoemdia'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '1.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Assinado com a chave de debug para instalar direto no celular.
            // Para publicar na Play Store, troque por uma chave própria.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // O site em ../../web vira os arquivos internos do app (assets/www)
    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets']
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}

// Copia a versão web para dentro do APK antes de empacotar
tasks.register('copyWeb', Copy) {
    from "${rootDir}/../web"
    into "${projectDir}/src/main/assets/www"
}
preBuild.dependsOn copyWeb
