<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#13201A"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Treino em Dia</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: app de coluna única para celular, barra de abas fixa embaixo, cartões só onde há ação */
:root{
  --bg:#EEF2EE; --surface:#FFFFFF; --sunk:#E3E9E4; --ink:#13201A; --muted:#56665D; --line:#D2DBD4;
  --accent:#D94E24; --accent-soft:#FBE3D9; --on-accent:#FFFFFF;
  --water:#1F6FC6; --water-soft:#DCEAF8; --ok:#1D8757; --ok-soft:#D8EFE2; --gold:#E4A72B;
  --gain:#2F6FD6; --loss:#D63A3A; --body:#566B80; --body-reg:#566B80; --body-out:#E7ECEF; --body-line:#C4CDD5; --body-sep:#D9E0E6;
  --shadow:0 8px 30px rgba(19,32,26,.12);
  --f-disp:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1310; --surface:#161F1A; --sunk:#1E2923; --ink:#E6EEE8; --muted:#93A39A; --line:#29362F;
  --accent:#FF7B4F; --accent-soft:#3A2219; --on-accent:#1A0D07;
  --water:#5BA7F4; --water-soft:#16283A; --ok:#4BC488; --ok-soft:#173326; --gold:#F0BE52;
  --gain:#5FA0FF; --loss:#FF6464; --body:#4A6177; --body-reg:#4A6177; --body-out:#222D35; --body-line:#3A4954; --body-sep:#1A232A;
  --shadow:0 8px 30px rgba(0,0,0,.45); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0D1310; --surface:#161F1A; --sunk:#1E2923; --ink:#E6EEE8; --muted:#93A39A; --line:#29362F;
  --accent:#FF7B4F; --accent-soft:#3A2219; --on-accent:#1A0D07;
  --water:#5BA7F4; --water-soft:#16283A; --ok:#4BC488; --ok-soft:#173326; --gold:#F0BE52;
  --gain:#5FA0FF; --loss:#FF6464; --body:#4A6177; --body-reg:#4A6177; --body-out:#222D35; --body-line:#3A4954; --body-sep:#1A232A;
  --shadow:0 8px 30px rgba(0,0,0,.45); color-scheme:dark }

/* mapa corporal */
.bodymap{width:100%;max-width:560px;margin:0 auto;background:#fff;border-radius:14px;padding:6px 0}
.bodymap svg{width:100%;height:auto;display:block}
.body-seg{align-self:center}
.alerts{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.al{font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;color:#fff;font-variant-numeric:tabular-nums}
.al.gain{background:var(--gain)} .al.loss{background:var(--loss)}
.bodymap .pulse{transform-box:fill-box;transform-origin:center;animation:ring 1.8s ease-out infinite}
@keyframes ring{from{transform:scale(.7);opacity:.9}to{transform:scale(2.4);opacity:0}}
.bodymap .hl{animation:glow 2.4s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:1}50%{opacity:.7}}
.role-chip{font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;background:var(--sunk);color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.role-chip.personal{background:var(--ink);color:var(--bg)}
.card.pick-role{flex-direction:row;align-items:center;gap:14px;text-align:left;cursor:pointer;width:100%}
.pick-role:hover{border-color:var(--accent)}
.pick-role strong{display:block;font-family:var(--f-disp);font-size:22px;text-transform:uppercase}
.pick-role .small{display:block}
.pr-ic{flex:none;width:52px;height:52px;border-radius:14px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.pr-ic svg{width:28px;height:28px}
button.card{font:inherit;color:inherit;cursor:pointer}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.liq-sum{display:flex;flex-direction:column;gap:4px;background:var(--water-soft);border-radius:12px;padding:10px 12px;font-size:14px}
.liq-chips{display:flex;flex-wrap:wrap;gap:6px;grid-column:1/-1}
.lq{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.lq b{color:var(--ink)}
.lq.w{background:var(--water-soft)}
.lq.w b{color:var(--water)}
.st-line{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.st{font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.st.ok{background:var(--ok-soft);color:var(--ok)}
.st.w{background:var(--water-soft);color:var(--water)}
.st.over{background:var(--accent-soft);color:var(--accent)}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:20px;font-weight:800;letter-spacing:.18em;background:var(--sunk);padding:6px 12px;border-radius:10px;user-select:all}
.fab{border:0;background:var(--accent);color:var(--on-accent);width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none}
.fab svg{width:22px;height:22px}
.card.aluno-it{flex-direction:row;align-items:center;gap:12px;text-align:left;width:100%}
.card.aluno-it.sel{border-color:var(--ok)}
.card.aluno-it strong{display:block;font-size:16px}
.card.aluno-it .small{display:block}
.av{flex:none;width:44px;height:44px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:800;font-size:15px}
.av.sm{width:34px;height:34px;font-size:13px}
.aluno-bar{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 12px}
.aluno-bar strong{display:block;font-size:15px;line-height:1.2}
.aluno-bar .small{display:block;line-height:1.1}
.set:disabled{cursor:default}
.legend .sw{width:12px;height:12px;border-radius:4px;display:inline-block}
.mlist{display:flex;flex-direction:column}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.mrow:first-child{border-top:0}
.mrow .nm{font-weight:600}
.mrow .nm .exm{display:block;font-weight:400}
.mrow .vv{font-size:13px;color:var(--muted);white-space:nowrap}
.chipd{font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.chipd.gain{background:var(--gain);color:#fff}
.chipd.loss{background:var(--loss);color:#fff}
.badge .md.perda{background:var(--loss)}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.tab-num{font-variant-numeric:tabular-nums}

.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:22px}

/* topo */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-disp);font-weight:700;font-size:25px;letter-spacing:.02em;text-transform:uppercase;line-height:1;display:flex;align-items:center;gap:8px}
.brand i{display:inline-block;width:10px;height:22px;background:var(--accent);transform:skewX(-14deg);border-radius:2px}
.top-r{display:flex;align-items:center;gap:8px}
.seg{display:flex;background:var(--sunk);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.icon-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--muted)}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-top:-14px}
.sync b{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.on b{background:var(--ok)} .sync.warn b{background:var(--gold)}

/* tipografia */
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
h1,h2,h3{font-family:var(--f-disp);font-weight:700;text-wrap:balance;margin:0;line-height:1.05}
h1{font-size:36px;text-transform:uppercase;letter-spacing:.01em}
h2{font-size:22px;text-transform:uppercase;letter-spacing:.02em}
h3{font-size:22px}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}

.hero{display:flex;flex-direction:column;gap:4px}
.stack{display:flex;flex-direction:column;gap:12px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px 12px;flex-wrap:wrap}
.link{border:0;background:none;color:var(--accent);font-weight:600;padding:4px 0}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.empty{align-items:flex-start}
.empty p{color:var(--muted)}

/* botões */
.btn{border:0;background:var(--accent);color:var(--on-accent);font-weight:700;padding:11px 18px;border-radius:12px;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.water{background:var(--water);color:#fff}
.btn.ok{background:var(--ok);color:#fff}
.btn.danger{color:var(--accent);border-color:var(--accent-soft)}
.btn.full{width:100%}
.btn:active{transform:translateY(1px)}
.btn[data-armed]{background:var(--accent);color:var(--on-accent)}

/* treino do dia */
.wk-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.wk-head > div{min-width:0}
.wk-name{font-family:var(--f-disp);font-weight:700;font-size:23px;line-height:1.05}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.ex{background:var(--accent-soft);color:var(--accent)}
.bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar > span{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.bar.ok > span{background:var(--ok)}
.exlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.exlist li + li{border-top:1px solid var(--line)}
.exbtn{width:100%;display:flex;align-items:center;gap:12px;border:0;background:none;padding:10px 0;text-align:left}
.chk{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;transition:.15s}
.chk svg{opacity:0}
.exbtn[aria-pressed="true"] .chk{background:var(--ok);border-color:var(--ok);color:#fff}
.exbtn[aria-pressed="true"] .chk svg{opacity:1}
.exbtn[aria-pressed="true"] .exn{text-decoration:line-through;color:var(--muted)}
.exn{font-weight:600;display:block}
.exm{font-size:13px;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}

/* água */
.water{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.ring{position:relative;width:132px;height:132px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .big{font-family:var(--f-disp);font-weight:700;font-size:30px;line-height:1;color:var(--water)}
.water-r{display:flex;flex-direction:column;gap:10px;min-width:0}
.water-btns{display:flex;gap:8px;flex-wrap:wrap}
.water-btns .btn{padding:9px 12px;font-size:14px}
.wlog{font-size:12px;color:var(--muted)}
@media (max-width:380px){.water{grid-template-columns:1fr;justify-items:center}.water-r{align-items:center;text-align:center}.water-btns{justify-content:center}}

/* semana */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:600}
.wd b{width:100%;max-width:40px;aspect-ratio:1;border-radius:10px;border:2px dashed var(--line);display:grid;place-items:center;color:var(--muted)}
.wd.p b{border:2px solid var(--accent);border-style:solid;color:var(--accent)}
.wd.d b{background:var(--ok);border:2px solid var(--ok);color:#fff}
.wd.t span{color:var(--ink)}
.stat-line{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.big-n{font-family:var(--f-disp);font-weight:700;font-size:30px;line-height:1}

/* calendário */
.cal-h{display:flex;align-items:center;justify-content:space-between}
.cal-h h2{font-size:24px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dw{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:center;padding-bottom:4px}
.cd{border:0;background:var(--surface);border-radius:10px;aspect-ratio:1/1.08;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:6px 2px 7px;min-width:0;border:1.5px solid transparent}
.cd .n{font-weight:600;font-size:14px}
.cd.past .n{color:var(--muted)}
.cd.today{border-color:var(--ink)}
.cd.sel{background:var(--ink);color:var(--bg)}
.cd.sel .n{color:var(--bg)}
.mk{display:flex;gap:3px;height:7px}
.mk i{width:7px;height:7px;border-radius:50%;display:block}
.mk i.p{border:1.5px solid var(--accent)}
.mk i.d{background:var(--ok)}
.mk i.w{background:var(--water);border-radius:50% 50% 50% 0;transform:rotate(-45deg)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.legend .mk{height:auto}

/* listas */
.plan{display:flex;justify-content:space-between;gap:12px;align-items:center}
.plan > div{min-width:0}
.plan .exm{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .v{font-family:var(--f-disp);font-weight:700;font-size:28px;line-height:1.05}
.kpi .l{font-size:12px;color:var(--muted)}
.delta{font-size:12px;font-weight:600}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:700;padding:6px 8px 6px 0}
td{padding:9px 8px 9px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
.x{border:0;background:var(--sunk);width:32px;height:32px;border-radius:50%;font-size:20px;line-height:1;color:var(--muted);display:grid;place-items:center;flex:none}
.x.sm{width:28px;height:28px;font-size:17px}
.x[data-armed]{background:var(--accent);color:var(--on-accent)}

.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.badge{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;min-width:0}
.badge .md{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff}
.badge .md.agua{background:var(--water)} .badge .md.treino{background:var(--accent)} .badge .md.semana{background:var(--ok)} .badge .md.marco{background:var(--gold)}
.badge b{display:block;font-size:13px;line-height:1.2}
.badge span{font-size:11px;color:var(--muted)}

svg text{font-family:var(--f-body)}
.ax{fill:var(--muted);font-size:10px}
.grid-l{stroke:var(--line);stroke-width:1}

/* recados */
.thread{display:flex;flex-direction:column;gap:8px;max-height:420px;overflow-y:auto;padding:4px 2px}
.msg{max-width:82%;padding:9px 12px;border-radius:14px;background:var(--sunk);align-self:flex-start;display:flex;flex-direction:column;gap:2px;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--accent-soft)}
.msg small{font-size:11px;color:var(--muted)}
.composer{display:flex;gap:8px}
.composer input{flex:1;min-width:0}

/* formulários */
input,select,textarea{width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none}
.fld{display:flex;flex-direction:column;gap:5px}
.fld > span{font-size:13px;font-weight:600;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.exed{display:flex;flex-direction:column;gap:10px}
.exrow{background:var(--sunk);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
.exrow input{background:var(--surface)}
.exnums{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;align-items:end}
.exrow-h{display:flex;gap:8px;align-items:center}
.exrow-h input{flex:1;min-width:0}
textarea{min-height:88px;resize:vertical;line-height:1.4}

/* séries */
.exitem{display:flex;flex-direction:column;gap:8px;padding:12px 0}
.exlist li + li{border-top:1px solid var(--line)}
.ex-top{display:flex;align-items:flex-start;gap:10px}
.ex-top .chk{margin-top:1px}
.ex-top > div{flex:1;min-width:0}
.exitem.done .chk{background:var(--ok);border-color:var(--ok);color:#fff}
.exitem.done .chk svg{opacity:1}
.exitem.done .exn{color:var(--muted)}
.info{border:0;background:var(--sunk);color:var(--muted);height:28px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:700;flex:none}
.sets{display:flex;gap:6px;flex-wrap:wrap;padding-left:36px}
.set{min-width:44px;height:40px;padding:0 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:13px;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;gap:4px;font-variant-numeric:tabular-nums}
.set.on{background:var(--ok);border-color:var(--ok);color:#fff}
.set.next{border-color:var(--accent);color:var(--accent)}
.btn:disabled{background:var(--sunk);color:var(--muted);cursor:not-allowed}

/* timer de descanso */
.rest{position:fixed;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom,0px));z-index:30;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.rest-in{max-width:536px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:18px;padding:10px 12px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);animation:up .2s ease-out}
.rest-ring{position:relative;width:52px;height:52px;flex:none}
.rest-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.rest-ring span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-disp);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.rest-txt{flex:1;min-width:0}
.rest-txt b{display:block;font-size:14px}
.rest-txt small{display:block;font-size:12px;opacity:.75;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rest button{border:0;border-radius:10px;padding:8px 10px;font-weight:700;font-size:13px;background:rgba(127,127,127,.25);color:inherit;flex:none}
.rest.end .rest-in{background:var(--ok);color:#fff}

/* banco de exercícios */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;white-space:nowrap;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.lib{display:flex;flex-direction:column}
.lib-it + .lib-it{border-top:1px solid var(--line)}
.lib-h{width:100%;border:0;background:none;display:flex;align-items:center;gap:10px;padding:11px 0;text-align:left}
.lib-h > span:first-child{flex:1;min-width:0}
.lib-h .exn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lib-body{display:flex;flex-direction:column;gap:10px;padding:0 0 14px}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.demo{position:relative;width:100%;max-width:100%;aspect-ratio:320/213;border-radius:12px;background-color:#fff;background-repeat:no-repeat;overflow:hidden;border:1px solid var(--line)}
.demo.anim{animation:flip 1.8s infinite}
@keyframes flip{0%,46%{background-position-x:0%}50%,96%{background-position-x:100%}100%{background-position-x:0%}}
.demo-tag{position:absolute;left:8px;bottom:8px;background:rgba(10,15,12,.72);color:#fff;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px}
.en-box{display:flex;flex-direction:column;gap:8px;align-items:flex-start;background:var(--sunk);border-radius:12px;padding:10px 12px}
.lib-h .tag{flex:none}
.en-box .steps{font-size:13px;color:var(--muted)}
.tip{background:var(--accent-soft);border-radius:10px;padding:9px 12px;font-size:13px}
.vid{width:100%;max-width:100%;border-radius:12px;background:#000;aspect-ratio:16/9}
.gtag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.extlink{color:var(--accent);font-weight:600;text-decoration:none;font-size:14px}
.file-btn{position:relative;overflow:hidden}
.file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer;min-height:0}
.up-st{font-size:13px;color:var(--muted)}
.demo-band{background:var(--gold);color:#1A1405;border-radius:12px;padding:10px 12px;font-size:13px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.demo-band button{border:0;background:rgba(0,0,0,.12);color:inherit;border-radius:8px;padding:6px 10px;font-weight:700}
.sumchips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.sumchips span{font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px}
.bodymap svg .m{transition:fill .3s}
.bodymap svg .m.gain{fill:var(--gain)}
.bodymap svg .m.loss{fill:var(--loss)}
.exnums label{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--muted);font-weight:600;min-width:0}
.exnums input{padding:8px;min-height:40px}

/* abas */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 10px;font-size:11px;font-weight:600;color:var(--muted)}
.tabs button[aria-current="page"]{color:var(--accent)}
.tabs svg{width:23px;height:23px}

/* folha inferior */
.sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:rgba(8,14,11,.45)}
.sheet-in{background:var(--surface);width:100%;max-width:560px;max-height:90vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;animation:up .22s ease-out}
.sh-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sh-foot{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;padding-top:4px}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}

/* parabéns */
.cele{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgba(8,14,11,.55);padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.cele-card{background:var(--surface);border-radius:24px;padding:28px 22px 22px;max-width:340px;width:100%;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;box-shadow:var(--shadow);animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
.cele-card h2{font-size:42px;color:var(--accent)}
.cele-card h3{font-size:24px}
.cele-card p{color:var(--muted)}
.medal{width:96px;height:96px}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:70}

body.resting .wrap{padding-bottom:calc(170px + env(safe-area-inset-bottom,0px))}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:80;max-width:calc(100% - 32px)}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

<script>

const pad=n=>String(n).padStart(2,'0');
const keyOf=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>keyOf(new Date());
const parse=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(k,n)=>{const d=parse(k);d.setDate(d.getDate()+n);return keyOf(d)};
const monday=k=>{const d=parse(k);d.setDate(d.getDate()-((d.getDay()+6)%7));return keyOf(d)};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const DIAS=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const fmtLong=k=>{const d=parse(k);return `${DIAS[d.getDay()]}, ${d.getDate()} de ${MESES[d.getMonth()]}`};
const fmtShort=k=>{const d=parse(k);return `${pad(d.getDate())}/${pad(d.getMonth()+1)}`};
const fmtN=(n,d=1)=>n==null||!isFinite(n)?'—':Number(n).toLocaleString('pt-BR',{maximumFractionDigits:d});
const fmtMl=n=>Number(n||0).toLocaleString('pt-BR')+' ml';
const toNum=v=>{if(v==null||v==='')return null;const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:null};
const hhmm=iso=>{const d=new Date(iso);return `${pad(d.getHours())}:${pad(d.getMinutes())}`};
function lsGet(k){try{return localStorage.getItem('ted_'+k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem('ted_'+k,v)}catch(e){}}
const CHECK='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

/* ---------- estado ---------- */

const S={}; COLS.forEach(c=>S[c]={});
let mode='loading', db=null, timedOut=false; const loaded=new Set();
const DEF_CFG={aluno:'Aluno',personal:'Personal',metaAgua:2500,copo:250,metaSemana:4,metaPeso:null,metaCarbo:200};
const cfg=()=>({...DEF_CFG,aluno:(curAluno&&nomeDe(curAluno).split(' ')[0])||'Aluno',...(S.cfg.main||{})});
/* perfis: cada pessoa escolhe uma vez; personal monta, aluno executa */
let userNS=null,myId=null,amOwner=false,localRole=lsGet('role');
const roleOf=()=>{if(mode==='db'&&myId){const p=S.papeis[myId];return p&&p.papel||null}return localRole==='personal'||localRole==='aluno'?localRole:null};
let role='aluno';
const IC={
 hoje:'<path d="M6.5 6.5v11M17.5 6.5v11M3 9.5v5M21 9.5v5M6.5 12h11"/>',
 painel:'<circle cx="12" cy="8" r="3.5"/><path d="M5 20c.8-3.6 3.6-5.5 7-5.5s6.2 1.9 7 5.5"/>',
 alunos:'<circle cx="9" cy="8" r="3.2"/><path d="M3 19c.6-3.2 3-5 6-5s5.4 1.8 6 5"/><circle cx="17" cy="9" r="2.6"/><path d="M16.5 14.2c2.4.2 4 1.8 4.5 4.3"/>',
 agenda:'<rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
 treinos:'<path d="M9 5h11M9 12h11M9 19h11M4 5h.01M4 12h.01M4 19h.01"/>',
 evolucao:'<path d="M3 17l5-5 4 3 8-8M15 7h5v5"/>',
 recados:'<path d="M4 5h16v11H9l-5 4z"/>'};
const TABS=()=>role==='personal'?(curAluno?[['alunos','Alunos'],['painel','Resumo'],['agenda','Agenda'],['treinos','Treinos'],['evolucao','Evolução'],['recados','Recados']]:[['alunos','Alunos']]):[['hoje','Hoje'],['agenda','Agenda'],['treinos','Treinos'],['evolucao','Evolução'],['recados','Personal']];
let tab=lsGet('tab')||'hoje';
let selDay=today(), calM=today().slice(0,7), editing=null;
function ready(){
  if(mode==='local'||timedOut)return true;
  if(mode!=='db'||loadedShared.size<SHARED.length)return false;
  return !curAluno||loadedPer.size===PER.length;
}

/* exemplos usados só quando o app roda sem nuvem */
const EXEMPLOS={
 'ex-a':{nome:'Treino A — Peito e tríceps',foco:'Hipertrofia · descanso 60–90 s',ex:true,exs:[{n:'Supino reto com barra',s:'4',r:'10',c:'30 kg'},{n:'Supino inclinado com halteres',s:'3',r:'12',c:'14 kg'},{n:'Crucifixo na máquina',s:'3',r:'12',c:'35 kg'},{n:'Tríceps na polia (corda)',s:'4',r:'12',c:'25 kg'},{n:'Tríceps francês',s:'3',r:'10',c:'10 kg'}]},
 'ex-b':{nome:'Treino B — Costas e bíceps',foco:'Hipertrofia · descanso 60–90 s',ex:true,exs:[{n:'Puxada frontal',s:'4',r:'10',c:'45 kg'},{n:'Remada baixa',s:'4',r:'10',c:'40 kg'},{n:'Remada unilateral',s:'3',r:'12',c:'16 kg'},{n:'Rosca direta',s:'3',r:'10',c:'20 kg'},{n:'Rosca martelo',s:'3',r:'12',c:'10 kg'}]},
 'ex-c':{nome:'Treino C — Pernas e ombros',foco:'Força · descanso 90 s',ex:true,exs:[{n:'Agachamento livre',s:'4',r:'8',c:'40 kg'},{n:'Leg press 45°',s:'4',r:'12',c:'120 kg'},{n:'Cadeira extensora',s:'3',r:'15',c:'35 kg'},{n:'Mesa flexora',s:'3',r:'12',c:'30 kg'},{n:'Desenvolvimento com halteres',s:'3',r:'10',c:'12 kg'},{n:'Elevação lateral',s:'3',r:'15',c:'6 kg'}]}
};

/* ---------- banco de exercícios (base pesquisada; o personal edita e cria os seus) ---------- */
const GRUPOS=['Peito','Costas','Ombros','Bíceps','Tríceps','Antebraço','Pernas','Glúteos','Panturrilha','Abdômen','Pescoço'];
const BASE={
 'b-supino-reto':{n:'Supino reto com barra',g:'Peito',s:'4',r:'8–12',p:90,passos:['Deite no banco com pés firmes no chão; cabeça, ombros e glúteos apoiados.','Segure a barra um pouco mais aberto que a largura dos ombros.','Desça controlando até perto do meio do peito, cotovelos a ~45° do tronco.','Empurre de volta estendendo os braços sem travar os cotovelos.'],dica:'Abdômen firme e lombar sem arquear em excesso. Escápulas encaixadas para trás.'},
 'b-supino-incl':{n:'Supino inclinado com halteres',g:'Peito',s:'3',r:'10–12',p:60,passos:['Ajuste o banco entre 30° e 45°.','Halteres na altura do peito, palmas para frente.','Desça controlando em direção às laterais da parte alta do peito.','Empurre para cima aproximando os halteres no topo, sem bater.'],dica:'Não trave os cotovelos no final e mantenha a coluna apoiada.'},
 'b-crucifixo':{n:'Crucifixo na máquina',g:'Peito',s:'3',r:'12–15',p:60,passos:['Ajuste o banco para que as manoplas fiquem na altura do peito.','Cotovelos levemente flexionados durante todo o movimento.','Feche os braços à frente contraindo o peito.','Volte devagar até sentir o alongamento, sem passar da linha dos ombros.'],dica:'Movimento de abraço; quem trabalha é o peito, não o bíceps.'},
 'b-flexao':{n:'Flexão de braço',g:'Peito',s:'3',r:'10–20',p:60,passos:['Mãos no chão um pouco além da largura dos ombros.','Corpo em linha reta da cabeça aos calcanhares.','Desça até o peito quase tocar o chão.','Empurre o chão e volte à posição inicial.'],dica:'Iniciante pode apoiar os joelhos. Não deixe o quadril cair.'},
 'b-puxada':{n:'Puxada frontal',g:'Costas',s:'4',r:'8–12',p:90,passos:['Sente de frente para a polia e prenda os joelhos no apoio.','Segure a barra pronada, mãos mais afastadas que os ombros.','Com peito aberto e ombros para baixo, puxe a barra até a parte alta do peito, cotovelos apontando para baixo.','Volte controlando, sem estender totalmente nem soltar os ombros.'],dica:'Não balance o tronco nem use impulso. Expire ao puxar.'},
 'b-remada-baixa':{n:'Remada baixa',g:'Costas',s:'4',r:'10–12',p:90,passos:['Sente com pés apoiados e joelhos levemente flexionados.','Coluna ereta e peito aberto, braços estendidos.','Puxe o triângulo até o abdômen levando os cotovelos para trás.','Junte as escápulas no final e volte devagar.'],dica:'O tronco fica parado; não jogue o corpo para trás.'},
 'b-remada-uni':{n:'Remada unilateral',g:'Costas',s:'3',r:'10–12',p:60,passos:['Apoie joelho e mão do mesmo lado no banco.','Costas retas, paralelas ao chão; halter na mão livre.','Puxe o halter em direção ao quadril, cotovelo rente ao corpo.','Desça controlando até alongar as costas.'],dica:'Evite girar o tronco para subir o peso.'},
 'b-desenv':{n:'Desenvolvimento com halteres',g:'Ombros',s:'3',r:'8–12',p:90,passos:['Sentado com encosto, halteres na altura dos ombros.','Palmas para frente, cotovelos levemente à frente do corpo.','Empurre os halteres para cima até quase estender os braços.','Desça controlando até a altura das orelhas.'],dica:'Não arqueie a lombar; abdômen contraído.'},
 'b-elev-lat':{n:'Elevação lateral',g:'Ombros',s:'3',r:'12–15',p:60,passos:['Em pé, halteres ao lado do corpo, cotovelos levemente flexionados.','Eleve os braços pelas laterais até a altura dos ombros.','Segure 1 segundo no topo.','Desça devagar sem deixar o peso cair.'],dica:'Use carga leve; sem balançar o corpo nem encolher os ombros.'},
 'b-cruc-inv':{n:'Crucifixo inverso',g:'Ombros',s:'3',r:'12–15',p:60,passos:['Na máquina voador de frente para o encosto, ou inclinado com halteres.','Braços estendidos à frente, cotovelos levemente flexionados.','Abra os braços para trás até a linha do corpo.','Volte controlando.'],dica:'Trabalha a parte de trás do ombro e melhora a postura.'},
 'b-rosca-dir':{n:'Rosca direta',g:'Bíceps',s:'3',r:'10–12',p:60,passos:['Em pé, barra com pegada supinada na largura dos ombros.','Cotovelos colados ao corpo.','Flexione os cotovelos trazendo a barra até os ombros.','Desça devagar até quase estender.'],dica:'Não balance o tronco; só o antebraço se move.'},
 'b-rosca-mart':{n:'Rosca martelo',g:'Bíceps',s:'3',r:'10–12',p:60,passos:['Em pé, halteres com pegada neutra (palmas para dentro).','Cotovelos fixos ao lado do corpo.','Suba os halteres até a altura dos ombros.','Desça controlando.'],dica:'Trabalha também o antebraço (braquiorradial).'},
 'b-triceps-polia':{n:'Tríceps na polia (corda)',g:'Tríceps',s:'4',r:'10–15',p:60,passos:['De frente para a polia alta, segure a corda.','Cotovelos colados ao corpo, tronco levemente inclinado.','Estenda os cotovelos e abra a corda no final.','Volte até os antebraços passarem da linha de 90°.'],dica:'Os cotovelos não sobem nem vão para frente.'},
 'b-triceps-frances':{n:'Tríceps francês',g:'Tríceps',s:'3',r:'10–12',p:60,passos:['Sentado, segure um halter com as duas mãos acima da cabeça.','Cotovelos apontados para cima e próximos à cabeça.','Desça o halter atrás da cabeça flexionando os cotovelos.','Estenda os braços de volta.'],dica:'Controle a descida para proteger o cotovelo.'},
 'b-agach':{n:'Agachamento livre',g:'Pernas',s:'4',r:'6–10',p:120,passos:['Barra apoiada no trapézio, pés na largura dos ombros, pontas levemente para fora.','Inspire, contraia o abdômen e desça levando o quadril para trás.','Joelhos acompanham a direção dos pés; desça até coxas paralelas ao chão ou o quanto mantiver a coluna neutra.','Empurre o chão e suba expirando.'],dica:'Calcanhares no chão e coluna neutra o tempo todo.'},
 'b-leg':{n:'Leg press 45°',g:'Pernas',s:'4',r:'10–12',p:90,passos:['Costas e quadril bem apoiados no encosto.','Pés na plataforma na largura dos ombros.','Destrave e desça até os joelhos formarem cerca de 90°.','Empurre sem travar os joelhos no final.'],dica:'Não deixe o quadril descolar do banco na descida.'},
 'b-extensora':{n:'Cadeira extensora',g:'Pernas',s:'3',r:'12–15',p:60,passos:['Ajuste o encosto para o joelho ficar alinhado ao eixo da máquina.','Apoio logo acima do tornozelo.','Estenda os joelhos até as pernas ficarem retas.','Segure 1 segundo e desça devagar.'],dica:'Segure nas alças para o quadril não sair do banco.'},
 'b-flexora':{n:'Mesa flexora',g:'Pernas',s:'3',r:'10–12',p:60,passos:['Deite de bruços com o joelho logo fora do banco.','Apoio acima do calcanhar.','Flexione os joelhos trazendo o apoio em direção aos glúteos.','Volte controlando sem bater o peso.'],dica:'Quadril colado no banco durante todo o movimento.'},
 'b-afundo':{n:'Afundo (passada)',g:'Pernas',s:'3',r:'10 cada perna',p:60,passos:['Em pé, dê um passo largo à frente.','Desça até os dois joelhos formarem cerca de 90°.','Tronco ereto e joelho da frente alinhado ao pé.','Empurre com a perna da frente e volte.'],dica:'Pode usar halteres para aumentar a carga.'},
 'b-stiff':{n:'Stiff',g:'Pernas',s:'3',r:'10–12',p:90,passos:['Em pé, barra ou halteres à frente das coxas.','Joelhos levemente flexionados e fixos.','Leve o quadril para trás descendo o peso rente às pernas até sentir o posterior alongar.','Suba contraindo glúteos e posteriores.'],dica:'Coluna sempre reta; a dobra é no quadril, não nas costas.'},
 'b-elev-pelv':{n:'Elevação pélvica',g:'Glúteos',s:'4',r:'10–12',p:90,passos:['Costas apoiadas no banco na altura das escápulas, barra sobre o quadril.','Pés no chão na largura do quadril, joelhos a 90° no topo.','Empurre o quadril para cima contraindo os glúteos.','Segure 1 segundo e desça controlando.'],dica:'Queixo levemente recolhido; não hiperestenda a lombar.'},

let FREE=null,freeErr=false,libMemo=null,libKey=[];

  fetch('exercicios-free.json').then(r=>{if(!r.ok)throw 0;return r.json()}).then(a=>{FREE={};a.forEach(x=>FREE[x.id]=x);freeErr=false;render()}).catch(()=>{freeErr=true;render()});

function LIB(){
  if(libMemo&&libKey[0]===S.exercicios&&libKey[1]===FREE&&libKey[2]===S.traducoes)return libMemo;
  const o={};
  for(const id in BASE){o[id]={...BASE[id],base:true};const f=FREE&&FREE['f:'+BASE_FT[id]];if(f){o[id].ft=f.ft;o[id].m=f.m;o[id].m2=f.m2;o[id].eq=f.eq}}
  if(FREE)for(const id in FREE){const x=FREE[id];o[id]={n:x.n,en:x.en,g:x.g,m:x.m,m2:x.m2,eq:x.eq,cat:x.cat,lv:x.lv,s:x.s,r:x.r,p:x.p,ins:x.ins,ft:x.ft,free:true}}
  for(const id in S.traducoes){const t=S.traducoes[id];if(o[id]&&t&&Array.isArray(t.passos))o[id].passos=t.passos}
  for(const id in S.exercicios){const v=S.exercicios[id];if(!v)continue;if(v.oculto){delete o[id];continue}o[id]={...(o[id]||{}),...v,base:!!BASE[id],free:!!(FREE&&FREE[id])}}
  for(const id in o)o[id]._s=normN([o[id].n,o[id].en,o[id].g,(o[id].m||[]).join(' '),o[id].eq].join(' '));
  libKey=[S.exercicios,FREE,S.traducoes];libMemo=o;return o;
}

function libFor(e){

function put(col,id,data,delay=0){

function queueWrite(path,id,delay,data){
  const k=path+'/'+id, stamp=Date.now()+Math.random(); pend[k]=stamp;
  const snap=data===undefined?undefined:JSON.parse(JSON.stringify(data));
  clearTimeout(timers[k]);
  timers[k]=setTimeout(()=>{
    delete timers[k];
    chains[k]=(chains[k]||Promise.resolve()).then(async()=>{
      const ref=db.collection(path).doc(id);
      try{ if(snap===undefined) await ref.delete(); else await ref.set(snap); }
      catch(e){ toast(e&&e.code==='quota_exceeded'?'Espaço de dados cheio. Apague registros antigos.':e&&e.code==='invalid_argument'?'Sem permissão para salvar isso. Peça ao dono do app o acesso certo.':'Não foi possível salvar agora. Tente de novo.'); }
      if(pend[k]===stamp&&!timers[k])delete pend[k];
    });
  },delay);
}
function listen(col,path,set,guard){
  return db.collection(path).onSnapshot(snap=>{
    if(guard&&!guard())return;
    const cur=S[col], o={};
    snap.docs.forEach(d=>{o[d.id]=d.data()});
    for(const k in pend){if(!k.startsWith(path+'/'))continue;const id=k.slice(path.length+1);if(id in cur)o[id]=cur[id];else delete o[id]}
    S[col]=o;
    if(!snap.metadata.fromCache)set.add(col);
    if(col==='papeis'||col==='cadastros'){syncAluno();vincular()}
    render();
  },err=>{
    if(['not_granted','capability_disabled','capability_removed'].includes(err&&err.code)&&mode==='db'){mode='local';loadLocal();}
    set.add(col);render();

function marcaSerie(k,id,x,j){
  const it=itensDia(k).find(i=>i.id===id),t=it&&S.treinos[it.t];
  if(!t||it.feito)return;
  const e=t.exs[x],cur=setsDone(it,t,x),nv=j<cur?j:j+1;
  setItem(k,id,i=>{i.sd=t.exs.map((_,y)=>y===x?nv:setsDone(i,t,y));delete i.ok;return i});
  if(nv<=cur)return;
  const after=itensDia(k).find(i=>i.id===id),p=progresso(after,t);
  if(p.f>=p.tot){stopRest();toast('Todas as séries feitas! Agora é só concluir o treino.');return}
  if(nv>=nSets(e)){
    let prox=null;for(let y=0;y<t.exs.length;y++){const yy=(x+1+y)%t.exs.length;if(setsDone(after,t,yy)<nSets(t.exs[yy])){prox=t.exs[yy];break}}
    startRest(pausaDe(e),prox?`Próximo: ${prox.n}`:'Próximo exercício');
  }else startRest(pausaDe(e),`${e.n} · série ${nv+1} de ${nSets(e)}`);
}
function concluir(k,id){

  if(t){const p=progresso(it,t);if(p.f<p.tot){toast(`Faltam ${p.tot-p.f} séries para concluir.`);return}}
  stopRest();
  let done=null; setItem(k,id,i=>{i.feito=true;i.em=new Date().toISOString();if(t)i.sd=t.exs.map(nSets);delete i.ok;done=i;return i});

}

let rest=null,restIv=null,actx=null;
function ensureAudio(){try{if(!actx){const A=window.AudioContext||window.webkitAudioContext;if(A)actx=new A()}if(actx&&actx.state==='suspended')actx.resume()}catch(e){}}
function beep(){
  try{if(!actx)return;const t0=actx.currentTime;[0,.28,.56].forEach((d,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=i===2?1175:880;o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(.0001,t0+d);g.gain.exponentialRampToValueAtTime(.35,t0+d+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+d+.22);o.start(t0+d);o.stop(t0+d+.25)})}catch(e){}

}
function startRest(sec,label){

function stopRest(){rest=null;clearInterval(restIv);const r=$('#rest');if(r)r.hidden=true;document.body.classList.remove('resting')}
function drawRest(){
  const r=$('#rest');if(!rest){r.hidden=true;return}
  const left=Math.max(0,Math.ceil((rest.end-Date.now())/1000)),C=2*Math.PI*22,p=rest.dur?left/rest.dur:0;
  r.hidden=false;r.className='rest'+(rest.done?' end':'');

    <div class="rest-ring"><svg viewBox="0 0 52 52"><circle cx="26" cy="26" r="22" fill="none" stroke="currentColor" stroke-opacity=".2" stroke-width="5"/><circle id="rest-arc" cx="26" cy="26" r="22" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p)}"/></svg><span id="rest-n">${rest.done?'0':left>=60?Math.floor(left/60)+':'+pad(left%60):left}</span></div>

    ${rest.done?'<button data-act="restSkip">Ok</button>':'<button data-act="restAdd">+15 s</button><button data-act="restSkip">Pular</button>'}</div>`;
}
function tickRest(){
  if(!rest)return;
  const left=Math.ceil((rest.end-Date.now())/1000);
  if(left<=0){if(!rest.done){rest.done=true;beep();drawRest();setTimeout(()=>{if(rest&&rest.done)stopRest()},5000)}return}
  const n=$('#rest-n'),a=$('#rest-arc');if(!n){drawRest();return}
  n.textContent=left>=60?Math.floor(left/60)+':'+pad(left%60):left;

async function analisarFoto(file){
  if(!file)return;
  if(!/^image\//.test(file.type)){toast('Escolha uma foto.');return}
  let blob=file;
  try{const bm=await createImageBitmap(file),sc=Math.min(1,1024/Math.max(bm.width,bm.height)),cv=document.createElement('canvas');cv.width=Math.round(bm.width*sc);cv.height=Math.round(bm.height*sc);cv.getContext('2d').drawImage(bm,0,0,cv.width,cv.height);blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',.82))||file}catch(e){}
  fotoRes={estado:'analisando',url:URL.createObjectURL(blob),itens:[]};openSheet(fotoSheet());
  const fail=m=>{fotoRes.estado='erro';fotoRes.msg=m;if(!$('#sheet').hidden)openSheet(fotoSheet())};
  if(!sampleNS){fail('A análise por foto não está disponível nesta visualização. Adicione os alimentos à mão.');return}
  try{const lim=await sampleNS.limits();if(!lim||!lim.images){fail('A análise de fotos não está liberada para esta conta. Adicione os alimentos à mão.');return}}catch(e){}
  try{
    const r=await sampleNS.json(`Você é nutricionista no Brasil. Olhe a foto de uma refeição, identifique cada alimento ou bebida visível, estime a porção pelo tamanho no prato e os carboidratos em gramas usando a Tabela TACO como referência. Some só o que aparece na foto. Se não houver comida na imagem, devolva a lista vazia e explique em "observacao". Responda apenas com JSON neste formato: {"itens":[{"nome":"Arroz branco cozido","porcao":"4 colheres de sopa (~100 g)","carbo_g":28}],"observacao":"frase curta sobre a estimativa ou dica"}`,{images:[blob],modelTier:'default'});
    const it=Array.isArray(r&&r.itens)?r.itens.filter(i=>i&&i.nome).slice(0,15).map(i=>({n:String(i.nome),por:String(i.porcao||''),g:Math.max(0,Math.min(500,+i.carbo_g||0))})):[];
    fotoRes={...fotoRes,estado:'ok',itens:it,obs:r&&r.observacao?String(r.observacao).slice(0,240):''};
    if(!$('#sheet').hidden)openSheet(fotoSheet());
  }catch(e){fail(e&&e.code==='rate_limited'?'Muitas análises seguidas. Tente de novo em instantes.':e&&e.code==='not_granted'?'Você não autorizou a análise de fotos. Adicione os alimentos à mão.':'Não foi possível analisar a foto agora. Tente outra foto, com o prato inteiro e boa luz.')}
}

async function uploadVideo(file){
  const st=$('#l-st');

  if(!/^video\//.test(file.type)){st.textContent='Escolha um arquivo de vídeo.';return}
  if(file.size>20*1024*1024){st.textContent=`Vídeo com ${fmtN(file.size/1048576,1)} MB. O limite é 20 MB: grave um trecho mais curto ou em resolução menor.`;return}

  try{const r=await assetsNS.upload(file);libEdit.vid=r.id;openSheet(libSheet());const s2=$('#l-st');if(s2)s2.textContent='Vídeo salvo. Toque em “Salvar no banco” para guardar o exercício.'}

async function salvarCad(key){
  const nome=val('cd-nome');if(!nome){toast('Informe o nome do aluno.');return}
  const alt=toNum(val('cd-alt')),peso=key?null:toNum(val('cd-peso'));
  let mA=toNum(val('cd-agua')),mC=toNum(val('cd-carb'));
  if(!mA&&peso)mA=Math.round(peso*35/100)*100;
  const base=key?(S.cadastros[key]||{}):{codigo:novoCodigo(),em:new Date().toISOString()};
  const id=key||('a-'+uid());
  const doc={...base,nome,obj:val('cd-obj'),alt:alt||null,tel:val('cd-tel'),obs:val('cd-obs'),metaAgua:mA||null,metaCarbo:mC||null};
  put('cadastros',id,doc);
  const alunoId=doc.uid||id;
  const metas={aluno:nome.split(' ')[0],...(mA?{metaAgua:Math.round(mA)}:{}),...(mC?{metaCarbo:Math.round(mC)}:{})};
  try{
    const ref=db.collection(`alunos/${alunoId}/cfg`).doc('main'),ex=await ref.get();
    await ref.set({...(ex.exists?ex.data():{}),...metas});
    if(peso)await db.collection(`alunos/${alunoId}/medidas`).doc(uid()).set({d:today(),peso});
  }catch(e){toast('Cadastro salvo, mas as metas não foram gravadas. Ajuste depois em Ajustes.')}
  if(key){closeSheet();toast('Cadastro atualizado');return}
  openSheet(`${head('Aluno cadastrado')}
    <p><strong>${esc(nome)}</strong> já aparece na sua lista. Você pode montar as fichas e agendar os treinos agora mesmo.</p>
    <p class="eyebrow">Código de vínculo</p>
    <div class="row"><span class="code" id="code-${id}">${doc.codigo}</span><button class="btn ghost" data-act="copiar" data-t="${doc.codigo}">Copiar</button></div>
    <p class="small muted">Compartilhe o app com o aluno como Colaborador e envie este código. Ao abrir, ele toca em “Sou o aluno” e digita o código. Os treinos que você montar passam para a conta dele automaticamente.</p>
    <div class="sh-foot"><button class="btn" data-act="abrirCad" data-id="${id}">Abrir ${esc(nome.split(' ')[0])}</button></div>`);
}

const statsCache={};let statsAt=0,statsPend=false;
async function fetchStats(ids){
  if(mode!=='db'||statsPend||Date.now()-statsAt<45000)return;
  statsPend=true;const k=today();
  try{await Promise.all(ids.filter(id=>!(S.cadastros[id]&&!S.cadastros[id].uid)).map(async id=>{
    const g=(c,d)=>db.collection(`alunos/${id}/${c}`).doc(d).get().then(s=>s.exists?s.data():null).catch(()=>null);
    const [a,cb,ag,cf]=await Promise.all([g('agua',k),g('carbos',k),g('agenda',k),g('cfg','main')]);
    const it=(ag&&ag.itens)||[];
    statsCache[id]={agua:(a&&a.ml)||0,metaA:(cf&&cf.metaAgua)||DEF_CFG.metaAgua,carb:Math.round(((cb&&cb.itens)||[]).reduce((s,i)=>s+(+i.g||0),0)),metaC:(cf&&cf.metaCarbo)||DEF_CFG.metaCarbo,treino:!it.length?'livre':it.every(i=>i.feito)?'feito':'pendente'};
  }))}catch(e){}
  statsAt=Date.now();statsPend=false;if(tab==='alunos')render();
}

  pickLib:()=>{readPlan();openSheet(pickSheet());editing._pick=true},
  pickBack:()=>openSheet(planSheet()),
  pick:d=>{const x=LIB()[d.lib];editing.exs=editing.exs.filter(e=>e.n||e.c);editing.exs.push({n:x.n,s:String(parseInt(x.s)||3),r:x.r||'12',c:'',p:'',l:d.lib});openSheet(planSheet());toast(`${x.n} adicionado`)},
  concluir:d=>concluir(d.k,d.id),
  desfazer:d=>desfazer(d.k,d.id),
  rmItem:d=>rmItem(d.k,d.id),
  agua:d=>addAgua(+d.ml),
  aguaUndo:()=>undoAgua(),
  aguaOutro:()=>{bebSel='agua';qtdSel=250;openSheet(bebidaSheet())},
  bebSel:d=>{const q=toNum(val('bq'));if(q)qtdSel=q;bebSel=d.b;openSheet(bebidaSheet())},
  qtdSel:d=>{qtdSel=+d.q;openSheet(bebidaSheet())},
  salvarBebida:()=>{const q=toNum(val('bq'));const n=Math.round(q||qtdSel);if(!(n>0&&n<=3000)){toast('Informe uma quantidade entre 1 e 3000 ml.');return}closeSheet();addLiquido(bebSel,n)},
  calNav:d=>{const [y,m]=calM.split('-').map(Number);const x=new Date(y,m-1+Number(d.d),1);calM=`${x.getFullYear()}-${pad(x.getMonth()+1)}`;render()},
  calDay:d=>{selDay=d.k;render()},
  novoTreino:()=>{editing={id:null,nome:'',foco:'',exs:[{n:'',s:'3',r:'12',c:''}]};openSheet(planSheet())},
  editTreino:d=>{const t=S.treinos[d.id];editing={id:d.id,nome:t.nome,foco:t.foco||'',exs:t.exs.map(e=>({...e}))};openSheet(planSheet())},
  addEx:()=>{readPlan();editing.exs.push({n:'',s:'3',r:'12',c:''});openSheet(planSheet());const e=document.getElementById('e-n-'+(editing.exs.length-1));e&&e.focus()},
  rmEx:d=>{readPlan();editing.exs.splice(+d.n,1);openSheet(planSheet())},
  salvarTreino:()=>{
    readPlan();const exs=editing.exs.filter(e=>e.n);
    if(!editing.nome){toast('Dê um nome ao treino.');return}
    if(!exs.length){toast('Adicione pelo menos um exercício.');return}
    const novo=!editing.id,id=editing.id||uid();
    put('treinos',id,{nome:editing.nome,foco:editing.foco,exs,at:new Date().toISOString()});
    closeSheet();toast('Treino salvo');
    if(novo)celebrate('montou-1','marco','Primeiro treino montado','Ficha criada. Agora é só agendar e executar!');
  },
  apagarTreino:()=>{const id=editing.id;closeSheet();del('treinos',id);toast('Treino apagado')},
  medida:()=>{if(demoEvo){demoEvo=false;render()}openMedida()},
  demoEvo:d=>{demoEvo=d.on==='1';render();const h=document.querySelector('#view .hero');if(h)h.scrollIntoView({block:'start'})},
  salvarMedida:()=>{
    const m={d:val('m-d')};MEDS.forEach(([k])=>m[k]=toNum(val('m-'+k)));
    if(!/^\d{4}-\d{2}-\d{2}$/.test(m.d)){toast('Informe a data.');return}
    if(MEDS.every(([k])=>m[k]==null)){toast('Preencha pelo menos uma medida.');return}
    const todas=medidasOrd(),antes=todas.filter(x=>x.peso!=null);
    const perdas=MEDS.map(([k,n,u])=>{if(m[k]==null)return null;const prev=todas.filter(x=>x[k]!=null&&x.d<=m.d).pop();if(!prev)return null;const d=m[k]-prev[k];return d<-0.05?`${n.split(' /')[0]} −${fmtN(-d)} ${u}`:null}).filter(Boolean);
    const mid=uid();put('medidas',mid,m);closeSheet();toast('Medidas salvas');
    celebrate('medida-1','marco','Primeira avaliação registrada','Agora dá para acompanhar sua evolução no mapa do corpo.');
    if(perdas.length)celebrate('perda-'+mid,'perda',perdas.length===1?'Você reduziu uma medida':`Você reduziu ${perdas.length} medidas`,`${perdas.join(' · ')}. O esforço está aparecendo!`);
    const mp=cfg().metaPeso;
    if(mp&&m.peso!=null&&antes.length){const ini=antes[0].peso;if((ini>mp&&m.peso<=mp)||(ini<mp&&m.peso>=mp))celebrate('peso-'+mp,'marco','Meta de peso alcançada',`Você chegou a ${fmtN(m.peso)} kg. Objetivo cumprido!`)}
  },
  rmMedida:d=>del('medidas',d.id),
  cmp:d=>{cmpMode=d.c;lsSet('cmp',cmpMode);render()},
  bodySide:d=>{bodySide=d.s;render()},
  salvarAjustes:()=>{
    const n=(id,def,min,max)=>{const v=toNum(val(id));return v==null?def:Math.min(max,Math.max(min,v))};
    const c={aluno:val('a-al')||'Aluno',personal:val('a-pe')||'Personal',metaAgua:Math.round(n('a-ma',2500,250,10000)),copo:Math.round(n('a-co',250,50,2000)),metaSemana:Math.round(n('a-ms',4,1,14)),metaPeso:toNum(val('a-mp')),metaCarbo:Math.round(n('a-mc',200,30,800))};
    put('cfg','main',c);closeSheet();toast('Ajustes salvos');
  },
  celeOk:()=>{$('#cele').hidden=true;setTimeout(nextCele,220)}
};
document.addEventListener('click',e=>{
  if(e.target.id==='sheet'){closeSheet();return}
  const b=e.target.closest('[data-act]');if(!b)return;
  if(b.dataset.confirm&&!b.dataset.armed){
    b.dataset.armed='1';const old=b.innerHTML;if(!b.classList.contains('x'))b.textContent='Toque de novo para confirmar';
    setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.innerHTML=old}},3000);return;
  }
  const f=ACT[b.dataset.act];if(f)f(b.dataset,b);
});
document.addEventListener('input',e=>{
  if(e.target.id==='lib-q'){libQ=e.target.value;libLim=40;const l=$('#lib-list');if(l)l.innerHTML=libListHTML()}
  else if(e.target.id==='pk-q'){const l=$('#pk-list');if(l)l.innerHTML=pickList(e.target.value)}
});
document.addEventListener('change',e=>{
  if(e.target.id==='l-file'&&assetsNS)uploadVideo(e.target.files&&e.target.files[0]);
  else if(e.target.id==='cb-file'){const f=e.target.files&&e.target.files[0];e.target.value='';analisarFoto(f)}
  else if(e.target.id==='lib-eq'||e.target.id==='lib-cat'){libEq=val('lib-eq');libCat=val('lib-cat');libLim=40;const l=$('#lib-list');if(l)l.innerHTML=libListHTML()}
});
let sheetLib=null;
function refreshLib(id){
  const l=$('#lib-list');if(l&&libOpen===id)l.innerHTML=libListHTML();
  if(sheetLib===id&&!$('#sheet').hidden){const x=LIB()[id];if(x)$('#sheet-in').innerHTML=`${head(esc(x.n))}${libBody(id,false)}`}
}
async function traduzir(id){
  const x=LIB()[id];if(!x||!sampleNS||trOn[id])return;
  trOn[id]=true;refreshLib(id);
  try{
    const r=await sampleNS.json(`Traduza para o português do Brasil, com o vocabulário usado em academias brasileiras, os passos de execução do exercício "${x.en}" (nome em português: "${x.n}"). Seja fiel ao original, use frases claras e curtas e não acrescente conteúdo. Responda apenas com um array JSON de strings, um item por passo, na mesma ordem.\n\nPassos:\n${JSON.stringify(x.ins)}`,{modelTier:'quick'});
    if(!Array.isArray(r)||!r.length||!r.every(s=>typeof s==='string'))throw {code:'formato'};
    put('traducoes',id,{passos:r.slice(0,20).map(s=>s.trim().slice(0,600)),em:new Date().toISOString()});
    toast('Execução traduzida e salva para todos');
  }catch(e){toast(e&&e.code==='rate_limited'?'Muitas traduções seguidas. Tente de novo em instantes.':e&&e.code==='not_granted'?'Tradução não autorizada nesta visualização.':'Não foi possível traduzir agora.')}
  finally{delete trOn[id];refreshLib(id)}
}
document.addEventListener('submit',e=>{
  if(e.target.id!=='fmsg')return;e.preventDefault();
  const i=$('#msg'),txt=i.value.trim();if(!txt)return;
  i.value='';put('recados',Date.now().toString(36)+'-'+uid(),{de:role,txt,em:new Date().toISOString()});
  const th=$('#thread');if(th)th.scrollTop=th.scrollHeight;
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('#cele').hidden)ACT.celeOk();else if(!$('#sheet').hidden)closeSheet()}});

let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600)}

/* ---------- render ---------- */
function render(){
  const v=$('#view'),keep={};v.querySelectorAll('input[id]').forEach(e=>keep[e.id]=e.value);
  const af=document.activeElement&&v.contains(document.activeElement)?document.activeElement.id:null;
  const th=$('#thread'),thAtEnd=!th||th.scrollTop+th.clientHeight>=th.scrollHeight-20;
  const ok=ready()&&mode!=='loading',r=ok?roleOf():null;
  if(r)role=r;
  const T=TABS();if(!T.some(x=>x[0]===tab))tab=T[0][0];
  if(!ok)v.innerHTML=`<section class="hero"><h1>Treino em Dia</h1></section>`+loadingCard();
  else if(!r)v.innerHTML=VIEWS.escolha();
  else v.innerHTML=(r==='personal'&&curAluno&&tab!=='alunos'?`<div class="aluno-bar"><span class="av sm">${esc((nomeDe(curAluno)||'A')[0].toUpperCase())}</span><span style="flex:1;min-width:0"><span class="small muted">Aluno</span><strong>${esc(nomeDe(curAluno)||'Aluno')}</strong></span><button class="link" data-act="tab" data-t="alunos">Trocar</button></div>`:'')+VIEWS[tab]();
  $('.tabs').hidden=!r;
  $('#tabs-in').style.gridTemplateColumns=`repeat(${T.length},minmax(0,1fr))`;
  $('#tabs-in').innerHTML=r?T.map(([t,l])=>`<button data-act="tab" data-t="${t}" ${t===tab?'aria-current="page"':''}>${svgI(IC[t])}${l}</button>`).join(''):'';
  const chip=$('#role-chip');chip.hidden=!r;chip.textContent=role==='personal'?'Personal':'Aluno';chip.className='role-chip '+role;
  $('#btn-aj').hidden=!r;
  if(r==='personal')vincular();
  for(const id in keep){const e=document.getElementById(id);if(e)e.value=keep[id]}
  if(af){const e=document.getElementById(af);if(e)e.focus()}
  const nt=$('#thread');if(nt&&thAtEnd)nt.scrollTop=nt.scrollHeight;
  if(r==='aluno')showUnseen();
  const s=$('#sync');s.className='sync '+(mode==='db'&&!timedOut?'on':mode==='local'||timedOut?'warn':'');
  s.querySelector('span').textContent=mode==='loading'?'Conectando…':mode==='db'?(timedOut&&!(loadedShared.size===SHARED.length&&(!curAluno||loadedPer.size===PER.length))?'Sem conexão com a nuvem ainda':'Sincronizado na nuvem'):'Salvo só neste aparelho';
  if(mode==='db'&&!nomesPend&&myId&&!(myId in nomes))fetchNomes();
}

(async function boot(){
  render();
  let tries=0;while(!window.claude&&tries<15){await new Promise(r=>setTimeout(r,100));tries++}
  let d=null;try{if(window.claude&&window.claude.use)d=await window.claude.use('db')}catch(e){}
  if(d){
    try{const u=await window.claude.use('user');if(u){userNS=u;myId=await u.id();amOwner=!!(await u.isOwner())}}catch(e){}
    db=d;mode='db';subscribeAll();
  }else{mode='local';loadLocal();syncAluno()}
  try{if(window.claude&&window.claude.use){window.claude.use('assets').then(a=>{assetsNS=a||null}).catch(()=>{});window.claude.use('sample').then(s=>{sampleNS=s||null}).catch(()=>{})}}catch(e){}
  loadFree();
  render();
})();
</script>
</body></html>
