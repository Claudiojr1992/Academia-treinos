name: Gerar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        run: gradle -p android assembleRelease --no-daemon

      - name: Renomear APK
        run: cp android/app/build/outputs/apk/release/app-release.apk TreinoEmDia-v1.0.${{ github.run_number }}.apk

      - name: Guardar APK no Actions
        uses: actions/upload-artifact@v4
        with:
          name: TreinoEmDia-apk
          path: TreinoEmDia-v1.0.${{ github.run_number }}.apk

      - name: Publicar na página de Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Treino em Dia v1.0.${{ github.run_number }}
          body: APK gerado automaticamente a partir do commit ${{ github.sha }}. Baixe o arquivo .apk abaixo e instale no Android.
          files: TreinoEmDia-v1.0.${{ github.run_number }}.apk
